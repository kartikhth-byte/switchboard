# Concierge — customer support for the fictional Palmgrove Stays (SHR-017).
agent: concierge
# Model is picked from measurement at the first real eval run; pricing must be known to LiteLLM.
model: {provider: anthropic, name: claude-sonnet-4-5, fallback: openai/gpt-4o-mini}
business: config/business.md
kb_path: data/fixtures/support/kb/
limits: {max_steps: 8, run_token_budget: 30000}
memory: {window_turns: 8, summarize_over_tokens: 6000, model: openai/gpt-4o-mini}
escalation:                  # SUPP-010: whether to hand off is decided in code, not by the agent
  check: true                # classify every guest message (prompts/escalation.md, memory model)
  triggers: [requested, frustrated, policy_exception, damage, safety, emergency]
  channel: slack             # mock in CI
  # Missing answers escalate via final_answer (escalate: true or confidence < min_confidence).
rules:
  min_confidence: 0.5          # below this, final answers are escalated (SUPP-014)
  max_identity_attempts: 3     # failed lookup_booking attempts before a person takes over
  approval_required:           # conditional workflow (SUPP-003): these need a manager first
    create_ticket:
      category: [refund_request]
  refund_policy:               # direct bookings; mirrors KB doc 03 (a test checks they match)
    standard:                  # check-in 1 Mar – 30 Nov
      tiers: [{min_days: 30, refund_percent: 100}, {min_days: 14, refund_percent: 50}, {min_days: 0, refund_percent: 0}]
    peak:                      # check-in 1 Dec – 28 Feb
      tiers: [{min_days: 45, refund_percent: 100}, {min_days: 21, refund_percent: 50}, {min_days: 0, refund_percent: 0}]
    peak_months: [12, 1, 2]
    festive_non_refundable: ["12-24", "01-02"]
    processing_fee_inr: 500
