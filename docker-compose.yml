# Default `docker compose up`: postgres + api + web.
# Optional profiles: `--profile n8n` (Dispatcher intake, M3), `--profile langfuse` (self-hosted
# tracing fallback; Langfuse Cloud is the default per ADR).
name: switchboard

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-switchboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-switchboard}
      POSTGRES_DB: ${POSTGRES_DB:-switchboard}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-switchboard}:${POSTGRES_PASSWORD:-switchboard}@postgres:5432/${POSTGRES_DB:-switchboard}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    # Polling jobs worker (SHR-007): same image as the API, different command.
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    command: ["python", "-m", "core.jobs"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-switchboard}:${POSTGRES_PASSWORD:-switchboard}@postgres:5432/${POSTGRES_DB:-switchboard}
    depends_on:
      api: { condition: service_healthy }  # api runs migrations first
    restart: unless-stopped

  web:
    build: { context: ./web }
    environment:
      API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

  n8n:
    profiles: ["n8n"]
    image: n8nio/n8n:1.80.0
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
    ports: ["5678:5678"]
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n:/workflows:ro

  langfuse:
    profiles: ["langfuse"]
    # v2 is the last single-container Langfuse (v3 needs ClickHouse + Redis + S3).
    # Fallback only; use Langfuse Cloud unless the free tier runs out.
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-switchboard}:${POSTGRES_PASSWORD:-switchboard}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me-local-only}
      SALT: ${LANGFUSE_SALT:-change-me-local-only}
      TELEMETRY_ENABLED: "false"
    ports: ["3001:3000"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  n8ndata:
